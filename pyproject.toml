[project]
name = "werkbot"
version = "0.1.0"
description = "Finds English-speaking Werkstudent/HiWi jobs in Germany, scores them against your resume, and tailors a LaTeX resume and cover letter."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    # fetching
    "httpx>=0.27",
    "tenacity>=8.2",
    # parsing
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.12",
    # data models and config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",  # puts the API keys from .env where LiteLLM looks for them
    "pyyaml>=6.0",
    # dedup and filtering
    "rapidfuzz>=3.9",
    "lingua-language-detector>=2.0",
    # LLM (fit scoring: reading each ad's requirements)
    "litellm>=1.40",
    # tailoring
    "jinja2>=3.1",
    # CLI and logging
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
]

[project.optional-dependencies]
# JavaScript-heavy sites (foorilla, DFKI). After installing: `playwright install chromium`
browser = ["playwright>=1.44"]
# LinkedIn via the public guest pages
linkedin = ["python-jobspy>=1.1.80"]
# Local embeddings for the semantic part of the fit score (pulls in PyTorch, ~1-2 GB)
ml = ["sentence-transformers>=3.0"]
# Telegram notifications
bot = ["python-telegram-bot>=21.0"]
all = ["werkbot[browser,linkedin,ml,bot]"]

[project.scripts]
werkbot = "werkbot.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/werkbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_llm_client: run LLM.from_settings for real (it only checks for an API key)"]