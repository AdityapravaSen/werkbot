details:
  # Descriptions are fetched from the job page for jobs that pass the location and role
  # filters but have no description yet (needed for the language filter and scoring).
  min_description_chars: 300  # shorter than this counts as "no description"
  delay_s: 2                  # between two requests to the same site
  max_per_run: 150            # all sites together; the rest is fetched next run
  retry_failed_after_days: 3
  per_site:                   # stricter limits for some sites
    linkedin.com: {delay_s: 5, max_per_run: 40}
    # connecticum's job pages only show the job's facts, not the ad itself (checked Oct 2026)
    connecticum.de: {skip: true}