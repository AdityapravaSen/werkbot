# Filters (Phase 3): which jobs you see. Change anything here, then run: werkbot filter
#
# Every job gets one decision:
#   keep    fits all rules
#   review  probably fits, but something is unclear (shown, marked with the reason)
#   drop    clearly does not fit (the reason is saved; see output/filtered.csv)
#
# Text matching: words are matched as whole words, without case or umlauts
# ("Büro" = "buero" = "Buro"). A word ending in * matches anything that starts with it
# ("entwickl*" = Entwickler, Entwicklung); a word starting with * matches the end of a
# German compound ("*informatik" = Wirtschaftsinformatik). A word written in CAPITALS only
# matches in capitals ("IT" matches "IT-Support" but not "it").

location:
  home: Kaiserslautern
  max_distance_km: 200        # straight line from home
  # Places further away that are still easy by train. A place counts if its fastest
  # connection is at most max_train_hours. Times are the fastest DB connection from
  # Kaiserslautern Hbf (bahn.de, checked Oct 2026). Add places in the same format.
  max_train_hours: 3.0
  train_times:
    Köln: "2:27"
    Ulm: "2:22"
    Düsseldorf: "2:55"
    Würzburg: "2:57"
    Augsburg: "3:03"
    Aachen: "3:29"
    München: "3:34"
    Dortmund: "3:43"
    Essen: "3:44"
    Nürnberg: "3:56"
  countries: [DE]             # jobs in other countries are dropped (even if close, e.g. Luxembourg)
  # Work mode, for jobs OUTSIDE the area above (jobs inside the area are always fine):
  remote_outside_area: keep   # fully remote ("100% remote", "deutschlandweit")
  hybrid_outside_area: review # "Homeoffice möglich", "teilweise remote": still means trips to the office
  unknown_place: review       # no city given (e.g. only "Germany"), or a place not in data/places.tsv

language:
  # How each level of required German is handled. The level comes from what the ad says
  # about German (also in German: "fließende Deutschkenntnisse", "Deutsch von Vorteil").
  fluent: drop                # fluent / very good / native / C1 / C2 / verhandlungssicher / "German-speaking"
  required: review            # German required, but no level given ("Deutschkenntnisse erforderlich")
  good: keep                  # good German ("gute Deutsch- und Englischkenntnisse"), B1/B2
  plus: keep                  # a plus / basic / "von Vorteil" / "wünschenswert"
  # The ad is written in German and says nothing about language. Usually means German at
  # work, but not always (many tech teams speak English).
  german_ad_no_mention: review

role:
  # The job must be one of these kinds (title, job type or description):
  kinds: [working_student, internship, part_time]   # also possible: thesis
  # A job that is clearly another kind is dropped:
  not_wanted: [full_time_only, apprenticeship, dual_study, phd]
  # Field: at least one tech word, and not mainly a non-tech job.
  tech_words:
