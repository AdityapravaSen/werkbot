# All job sources. Adding or removing a site is a config change, not a code change.
# group: A = API/feed, B = HTML with pages, C = JavaScript-loaded, D = page watcher, E = LinkedIn
# adapter: name of the adapter in src/werkbot/adapters/

# ---------- Group A: API or feed ----------
- name: arbeitnow
  group: A
  adapter: arbeitnow
  url: https://www.arbeitnow.com/api/job-board-api
  params:
    keywords: ["working student", "werkstudent", "studentische", "student assistant"]
    delay_s: 3        # rate-limits at ~1 request/second
    max_pages: 100    # NOT sorted by date: read until the pages run out (~5 min)
  notes: No search parameter and not sorted by date. Fetch all pages, filter locally.

- name: arbeitsagentur
  group: A
  adapter: arbeitsagentur
  url: https://rest.arbeitsagentur.de/jobboerse/jobsuche-service
  params:
    was: Werkstudent
    wo: Kaiserslautern
    umkreis: 200
    veroeffentlichtseit: 7
    size: 100
    fetch_details: true   # one extra request per job, for the description
    max_details: 300
    delay_s: 1
  notes: >-
    Public Jobsuche API used by arbeitsagentur.de itself. The website's branche=11
    (IT) filter is not available in the API, so our own filters narrow it down.

- name: ramstein_softgarden
  group: A
  adapter: softgarden_feed
  url: https://ramsteinaf.career.softgarden.de/jobs.feed.json
  params:
    locations: ["Ramstein-Miesenbach", "Kaiserslautern"]
    # The feed has no category field, so "IT / Engineering" is matched on the title.
    # Short words like "IT" must match as a whole word (not inside "Mitarbeiter").
    title_keywords:
      - IT
      - Informatik
      - Software
      - System
      - Netzwerk
      - Network
      - Daten
      - Data
      - Cyber
      - Admin
      - Ingenieur
      - Engineer
      - Techniker
      - Elektro
      - Werkstudent
      - Praktik
      - Student
  notes: US Air Force local national positions. Feed lists all jobs (no date filter).

- name: wearedevelopers
  group: A
  adapter: wearedevelopers
  url: https://www.wearedevelopers.com/jobs.md
  params:
    q: working student
    country: DE
    delay_s: 2
    max_pages: 15     # 24 jobs per page
  notes: >-
    Markdown version of the search (stable plain text). No description in the
    list; the job page link is kept for later. Apply links are stored as apply_url.

# ---------- Group B: HTML pages and data embedded in pages ----------
- name: connecticum
  group: B
  adapter: connecticum
  url: https://www.connecticum.de/jobs?details=&beschaeftigungsarten%5B0%5D=6&fieldsgruppen%5B0%5D=11&einsatzort=Kaiserslautern%2C+Germany&umkreis=200&volltext=
  params:
    delay_s: 2
    max_pages: 10     # 20 per page; follows the rel="next" link
  notes: HTML job cards. Mostly German-language ads.

- name: efellows
  group: B
  adapter: efellows
  url: https://jobs.e-fellows.net/jobs/it/werkstudent-duales-studium
  params:
    delay_s: 2
    max_pages: 10     # 10 per page
  notes: Reads the __NEXT_DATA__ JSON embedded in the page (exact dates, stable).

- name: fraunhofer
  group: B
  adapter: fraunhofer
  url: https://jobs.fraunhofer.de/search/?q=&optionsFacetsDD_customfield5=Rhineland-Palatinate&optionsFacetsDD_lang=en
  params:
    delay_s: 2
    max_pages: 10     # pages via &startrow=N
  notes: SAP SuccessFactors results table. Posted date is only on the detail page.

- name: workingstudentjobs
  group: B
  adapter: workingstudentjobs
  url: https://www.workingstudentjobs.de/?city=mannheim,heidelberg,frankfurt&state=RP,SL&field=tech
  params:
    delay_s: 2
    max_pages: 10
  notes: >-
    Reads the job objects embedded in the page (not the HTML, which also has an
    unrelated "Trending" sidebar). Gives is_german_required per job.

# germantechjobs moved to Group A: the site is a JavaScript app, but it has a JSON API.
- name: germantechjobs
  group: A
  adapter: germantechjobs
  url: https://germantechjobs.de/api/jobsLight
  params:
    # Matched case-insensitively as substrings of the job's "jobType" / "language".
    # The scrape log prints every value that exists, so you can adjust these.
    # Values seen live (2026-10-16): Full-Time 1050, Internship 40, Contract 2, Part-Time 1
    job_types: ["part-time", "internship", "working student", "werkstudent"]
    languages: ["English"]
  notes: One request returns all jobs; jobType and language filters run on our side.

# ---------- Group C: JavaScript sites (data endpoints found with scripts/probe_network.py) ----------
- name: foorilla
  group: C
  adapter: foorilla
  url: https://foorilla.com/hiring/jobs/
  params:
    # The site's own filters live in the browser session, so we use its quick search
    # and keep only jobs whose location mentions one of these (whole-word match).
    search_terms: ["working student", "werkstudent"]
    location_keywords:
      [Germany, Deutschland, Kaiserslautern, Saarbrücken, Saarbruecken, Mannheim, Heidelberg,
       Karlsruhe, Frankfurt, Mainz, Darmstadt, Stuttgart, Munich, München, Berlin, Hamburg,
       Cologne, Köln, Düsseldorf, Bonn, Trier, Ludwigshafen]
    delay_s: 2
    max_pages: 5
  notes: Django + htmx HTML fragments. No company name in the list (comes with the details).

- name: dfki
  group: C
  adapter: dfki
  url: https://jobs.dfki.de/utf8/ic_job_feeds.feed_engine
  params:
    category_codes: ["23427-662551"]   # Teilzeit (your original filter)
  notes: JSON feed behind the jobs page. All DFKI sites; location filter happens in Phase 3.

- name: dfki_hiwi
  group: C
  adapter: dfki
  url: https://jobs.dfki.de/utf8/ic_job_feeds.feed_engine
  params:
    category_codes: ["23805-667250"]   # Wissenschaftl. Hilfskraft (HiWi), any working time
  notes: HiWi jobs are not always tagged Teilzeit, so they get their own search.

# ---------- Group D: page watchers ----------
- name: mpi_inf_d2
  group: D
  adapter: page_watch
  url: https://www.mpi-inf.mpg.de/departments/computer-vision-and-machine-learning/application/hiwi-/-student-assistants
  params:
    label: MPI-INF D2 (Computer Vision & ML) HiWi page
    organization: Max Planck Institute for Informatics
  notes: General HiWi call. Alert on change. Cold-email target.

- name: mpi_inf_d6
  group: D
  adapter: page_watch
  url: https://www.mpi-inf.mpg.de/departments/visual-computing-and-artificial-intelligence/offers
  params:
    label: MPI-INF D6 (Visual Computing & AI) offers page
    organization: Max Planck Institute for Informatics
  notes: No HiWi openings listed. Alert on change. Cold-email target.

# ---------- Group E: LinkedIn (needs: uv sync --group dev --extra linkedin) ----------
- name: linkedin_local
  group: E
  adapter: linkedin
  url: https://www.linkedin.com/jobs/
  params:
    search_term: working student
    location: Kaiserslautern, Germany
    distance: 100      # miles, about 160 km
    hours_old: 168     # 7 days
    results_wanted: 50

- name: linkedin_remote
  group: E
  adapter: linkedin
  url: https://www.linkedin.com/jobs/
  params:
    search_term: working student
    location: Germany
    is_remote: true
    hours_old: 168
    results_wanted: 50