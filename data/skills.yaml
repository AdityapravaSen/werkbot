# Skill words for fit scoring (Phase 4). Used to
#   - find your skills in data/master_resume.yaml (skills lists, tags and bullet texts),
#   - match a job's requirements to them ("K8s" in an ad = "Kubernetes" on your resume),
#   - find requirements in an ad when no LLM is available.
#
# Format:  Name: [other spellings]
# Matching ignores case and umlauts, except for spellings of one or two letters ("R", "Go",
# "ML"), which only match as written in a text. Add anything that is missing; the name is
# what the reasons show.

